name: kitatemani
description: Platform Digital untuk Pencegahan dan Pelaporan Bullying di Lingkungan Sekolah.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  archive: ^4.0.0
  camera: ^0.12.0+2
  connectivity_plus: ^7.3.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.0.17
  geolocator: ^14.0.1
  google_fonts: ^6.2.1
  http: ^1.2.0
  image: ^4.13.1
  image_picker: ^1.2.4
  intl: any
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  record: ^6.2.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  video_player: ^2.9.2
  web: ^1.1.1
  xml: ^7.0.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/mascot/
    - assets/illustrations/
