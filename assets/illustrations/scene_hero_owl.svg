    <circle cx="97.3" cy="67.2" r="0.95" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="120.7" cy="63.3" r="2.1" fill="#FFFFFF"/>
    <circle cx="124.3" cy="67.2" r="0.95" fill="#FFFFFF" opacity="0.8"/>

