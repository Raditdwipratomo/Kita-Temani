    <path d="M 101 135 C 100 139 101 142 104 142 C 107 142 109 139 108 135" fill="#F5A623"/>
    <path d="M 116 134 C 115 138 116 141 119 141 C 122 141 124 138 123 134" fill="#F5A623"/>
    <path d="M 122 133 C 122 137 124 140 127 140 C 130 140 131 136 129 133" fill="#F5A623" stroke="#E08E16" stroke-width="1" stroke-linecap="round"/>
