    <path d="M 109 57 C 115 47 132 48 136 60 C 140 72 130 84 116 83 C 112 83 110 81 109 79 C 108 81 106 83 102 83 C 88 84 78 72 82 60 C 86 48 103 47 109 57 Z" fill="#FFFFFF"/>

