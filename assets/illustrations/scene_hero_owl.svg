  <!-- Two subtle drifting botanical petals (calm organic motion, zero AI sparkles) -->
  <path d="M 52 54 C 55 48 61 48 62 53 C 58 57 54 57 52 54 Z" fill="#A7E3C6" opacity="0.85"/>
  <path d="M 164 42 C 169 38 174 41 172 46 C 168 47 165 46 164 42 Z" fill="#C9D0FB" opacity="0.8"/>
